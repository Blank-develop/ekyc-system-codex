name: Dependency scan (SCA)

# Software-composition analysis: fail CI when a known vulnerability appears in a
# backend Python or frontend npm dependency. Runs on every push/PR and weekly so
# newly disclosed advisories surface even without a code change. Dependabot
# (.github/dependabot.yml) opens the fix PRs; this gate keeps them from being
# ignored.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Backend Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend/requirements.txt
        run: pip-audit -r backend/requirements.txt --desc

  npm-audit:
    name: Frontend npm (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit frontend dependencies (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
