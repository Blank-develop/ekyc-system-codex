services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laligence_ekyc}
      POSTGRES_USER: ${POSTGRES_USER:-laligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/digitalocean/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laligence} -d ${POSTGRES_DB:-laligence_ekyc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-laligence}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-laligence_ekyc}
      LALIGENCE_CORS_ORIGINS: ${LALIGENCE_CORS_ORIGINS:?set LALIGENCE_CORS_ORIGINS in deploy/digitalocean/.env}
      LALIGENCE_MAX_UPLOAD_SIZE_BYTES: ${LALIGENCE_MAX_UPLOAD_SIZE_BYTES:-8388608}
      LALIGENCE_MAX_REQUESTS_PER_MINUTE: ${LALIGENCE_MAX_REQUESTS_PER_MINUTE:-240}
      LALIGENCE_ALLOWED_UPLOAD_CONTENT_TYPES: ${LALIGENCE_ALLOWED_UPLOAD_CONTENT_TYPES:-image/jpeg,image/jpg,image/png,image/webp}
      LALIGENCE_MIN_FACE_MATCH_SCORE: ${LALIGENCE_MIN_FACE_MATCH_SCORE:-0.68}
      LALIGENCE_MAX_PASSIVE_LIVENESS_RISK: ${LALIGENCE_MAX_PASSIVE_LIVENESS_RISK:-0.34}
      LALIGENCE_MAX_DOCUMENT_FRAUD_RISK: ${LALIGENCE_MAX_DOCUMENT_FRAUD_RISK:-0.42}
      LALIGENCE_FACE_LOGIN_MATCH_THRESHOLD: ${LALIGENCE_FACE_LOGIN_MATCH_THRESHOLD:-0.72}
      LALIGENCE_PAD_ENABLE_COMPANION_MODELS: ${LALIGENCE_PAD_ENABLE_COMPANION_MODELS:-false}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    build:
      context: ../..
      dockerfile: deploy/digitalocean/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in deploy/digitalocean/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
